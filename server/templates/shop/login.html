{% extends "shop/base_shop.html" %}
{% block title %}로그인{% endblock %}
{% block body %}
<h1>로그인</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/shop/login">
  <label>전화번호 <input type="text" name="phone" placeholder="010-1234-5678"></label>
  <button type="submit">로그인</button>
</form>
{% if samples %}
<div class="samples">
  <p>데모용 예시 고객</p>
  <ul>
    {% for s in samples %}<li>{{ s.name }} · {{ s.phone }}</li>{% endfor %}
  </ul>
</div>
{% endif %}
{% endblock %}
