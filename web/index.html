<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>음성 상담 에이전트</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body data-phase="IDLE">
<div class="layout">
  <section class="phone">
    <header>
      <div class="title-row">
        <div class="shop"><span id="shop-name">…</span> 고객센터</div>
        <button type="button" id="btn-settings" class="settings-btn" title="설정" aria-label="설정">⚙</button>
      </div>
      <div class="meta"><span id="status">대기</span> · <span id="clock">00:00</span></div>
      <a class="admin-link" href="/admin" data-modal-href="/admin" data-modal-title="어드민">어드민</a>
      <a class="admin-link" href="/shop" data-modal-href="/shop" data-modal-title="쇼핑몰">쇼핑몰</a>
    </header>
    <div id="transcript" class="transcript"></div>
    <div id="interim" class="interim"></div>
    <form id="text-form" class="text-form">
      <input id="text-input" type="text" placeholder="말하기 대신 입력하려면 여기에 쓰고 Enter" autocomplete="off">
    </form>
    <div class="controls">
      <div class="row row-call">
        <label class="field grow">
          <span>고객</span>
          <select id="sample-select"><option value="">비회원(번호 없음)</option><option value="__manual">번호 직접 입력…</option></select>
        </label>
        <input id="phone-input" type="tel" placeholder="010-0000-0000" autocomplete="off" hidden>
        <button id="btn-call" class="call">📞 전화 걸기</button>
        <button id="btn-hangup" class="hangup">끊기</button>
      </div>
      <div class="row row-voice">
        <label class="field"><span>음성</span><select id="engine-select"><option value="browser">브라우저</option><option value="server">OpenAI</option></select></label>
        <label class="field grow"><span>목소리</span><select id="voice-select"></select></label>
        <button id="btn-voice-preview" type="button" class="voice-preview" title="선택한 목소리 미리듣기">▶ 미리듣기</button>
      </div>
    </div>
  </section>
  <aside class="admin">
    <div class="admin-top">
      <h2>관리자 패널</h2>
      <div id="panel"></div>
    </div>
    <div class="admin-bottom">
      <h2>통화 누적 통계</h2>
      <div id="stats-panel"></div>
    </div>
  </aside>
  <aside class="db">
    <h2>현재 고객</h2>
    <div id="db-pane-customer" class="db-pane-split">
      <div class="db-pane-top">
        <div id="db-customer-empty" class="db-empty">통화가 시작되면 고객 정보가 여기에 표시됩니다.</div>
        <div id="db-customer-card" hidden></div>
      </div>
      <div class="db-pane-bottom">
        <div id="db-active-empty" class="db-empty">통화가 시작되면 진행 중 주문이 여기에 표시됩니다.</div>
        <div id="db-active-orders" hidden></div>
      </div>
    </div>
  </aside>
</div>
<dialog id="link-modal" class="link-modal">
  <div class="link-modal-head">
    <span id="link-modal-title" class="link-modal-title"></span>
    <button type="button" id="link-modal-close" class="link-modal-close" title="닫기" aria-label="닫기">✕</button>
  </div>
  <iframe id="link-modal-frame" class="link-modal-frame" title="링크 미리보기"></iframe>
</dialog>
<dialog id="settings-modal" class="settings-modal">
  <form method="dialog" class="settings-form">
    <h3>OpenAI 키 설정</h3>
    <p class="settings-hint">이 키는 이 브라우저에만 저장되고 서버·DB·로그에 남지 않습니다.</p>
    <label class="settings-field">
      <span>OpenAI API 키</span>
      <input id="settings-key-input" type="password" placeholder="sk-..." autocomplete="off" spellcheck="false">
    </label>
    <div id="settings-key-status" class="settings-key-status"></div>
    <div class="settings-actions">
      <button type="button" id="btn-key-clear" class="ghost">삭제</button>
      <button type="button" id="btn-key-check" class="ghost">연결 확인</button>
      <button type="submit" id="btn-key-save" class="call">저장</button>
    </div>
  </form>
</dialog>
<script type="module" src="/static/call.js"></script>
</body>
</html>
